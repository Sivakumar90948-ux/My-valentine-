<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>One Question 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#ff9a9e,#fad0c4);
      font-family: 'Poppins', sans-serif;
    }

    .box{
      background:white;
      padding:30px;
      border-radius:25px;
      text-align:center;
      box-shadow:0 15px 40px rgba(0,0,0,0.2);
      width:90%;
      max-width:350px;
    }

    h1{
      color:#e91e63;
    }

    button{
      border:none;
      padding:12px 22px;
      font-size:16px;
      border-radius:30px;
      cursor:pointer;
      margin:10px;
    }

    .yes{
      background:#e91e63;
      color:white;
    }

    .no{
      background:#eee;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Will you be my Valentine? 💌</h1>

    <button class="yes" onclick="location.href='yes.html'">
      Yes 💖
    </button>

    <button class="no" onclick="makeYesBig()">
      No 🙈
    </button>
  </div>

<script>
  function makeYesBig(){
    const yesBtn = document.querySelector('.yes');
    let size = parseInt(window.getComputedStyle(yesBtn).fontSize);
    yesBtn.style.fontSize = (size + 6) + "px";
  }
</script>
</body>
</html>
